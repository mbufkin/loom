# Hosted Loom app on the Pi (raspberrypi). See RUNBOOK.md.
#   cd deploy/hosted-app && docker compose up -d --build
# LOOM_APP_ROOT defaults to the 1 TB SSD.
name: loom-app
services:
  loom-app:
    build:
      context: ../..
      dockerfile: deploy/hosted-app/Dockerfile
    image: loom-app:latest
    container_name: loom-app
    restart: unless-stopped
    # app.env (mode 600 on the host, never in git or the image):
    #   NVIDIA_API_KEY, LOOM_ACCESS_TEAM_DOMAIN, LOOM_ACCESS_AUD,
    #   optional LOOM_ALLOWED_EMAILS.
    env_file:
      - ${LOOM_APP_ROOT:-/media/mbufkin/pi-srv/loom-app}/secrets/app.env
    environment:
      # Cloudflare's free plan caps request bodies at 100 MB; stay under it so
      # the server's own message is what a person sees.
      LOOM_MAX_UPLOAD_MB: "95"
    # Loopback only: cloudflared on the host reaches it; the LAN does not.
    ports:
      - "127.0.0.1:8790:8770"
    volumes:
      # create_host_path: false — if the SSD is not mounted, refuse to start
      # instead of silently writing district documents to the SD card.
      - type: bind
        source: ${LOOM_APP_ROOT:-/media/mbufkin/pi-srv/loom-app}/data
        target: /data
        bind: { create_host_path: false }
      # Pinned model config, read-only, layered over the data volume so the
      # server's own CONFIG path and the pipeline's LOOM_CONFIG agree.
      - type: bind
        source: ./config.hosted.yaml
        target: /data/config.yaml
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      # /healthz needs no token, but only from inside the container (127.0.0.1).
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8770/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Public pages for loomaudit.com (landing + sign-in). Static files only, no secrets,
  # no access to app data. Separate from loom-app on purpose: a mistake in a public
  # page cannot reach the app, and the app can be rebuilt without touching this.
  loom-landing:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: loom-landing
    restart: unless-stopped
    # Loopback only: cloudflared reaches it; the LAN does not.
    ports:
      - "127.0.0.1:8791:8080"
    volumes:
      - type: bind
        source: ./landing
        target: /usr/share/nginx/html
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./landing.nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
