# nginx config for the public pages (loomaudit.com): landing/ is served as-is.
# Mounted read-only into the `loom-landing` container (see docker-compose.yml).
#
# Educational note: nginx replaces, not merges, inherited add_header lines when a
# `location` block defines its own. So every header lives here at server level and
# no location block may add one.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Same hardening the page assumes (the pages' own CSP is in their <meta> tag).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Short cache: pages are tiny and edits should show up within minutes.
    add_header Cache-Control "public, max-age=300" always;

    gzip on;
    gzip_types text/css text/html image/svg+xml;

    # `$uri/` makes / serve index.html; `$uri.html` makes /signin serve signin.html.
    # Anything else that is not a file is a 404;
    # there is no directory listing and no fallback to the app.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
