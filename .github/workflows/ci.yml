name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    name: Offline-safe tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline-safe suite
        run: |
          python3 test_schema_validate.py
          python3 test_audit.py
          python3 test_rollup.py
          python3 test_doc_extract.py
          python3 test_loom_pipeline.py
          python3 test_layer1_organize_batch.py
          python3 test_layer0_chunk_resume.py
          python3 test_layer0_ledger_complete.py
          python3 test_element_type_normalize.py
          python3 test_layer1_module_placement.py
          python3 test_finding_aggregation.py
          python3 test_lesson_bakeoff.py
          python3 test_route_degradation.py
          python3 test_te_prepass.py
          python3 test_lesson_rung.py
          python3 test_unit_rung.py
          python3 test_artifact_rung.py
          python3 test_packet_types.py
