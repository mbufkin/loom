name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    name: Offline-safe tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (PDF extract for intake goldens)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline-safe suite
        run: |
          python3 test_schema_validate.py
          python3 test_audit.py
          python3 test_rollup.py
          python3 test_doc_extract.py
          python3 test_loom_pipeline.py
          python3 test_intake_goldens_extract.py
