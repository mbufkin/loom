name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    name: Offline-safe tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (PDF extract for intake goldens)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline-safe suite
        run: |
          python3 test_schema_validate.py
          python3 test_audit.py
          python3 test_rollup.py
          python3 test_doc_extract.py
          python3 test_loom_pipeline.py
          python3 test_intake_goldens_extract.py
          python3 test_usage.py

      # Path A–H lenses: the router plus every presence extractor. These gate
      # the lens contract in docs/PATHS.md so a new path cannot silently break
      # an existing one. All are corpus-free (synthetic fixtures).
      - name: Run Path A-H lens suite
        run: |
          python3 test_keyword_match.py
          python3 test_route_lenses.py
          python3 test_path_a_lesson_plan.py
          python3 test_path_b_assessment.py
          python3 test_path_c_general.py
          python3 test_path_d_teacher_support.py
          python3 test_path_e_student_practice.py
          python3 test_path_f_standards_pacing.py
          python3 test_path_g_syllabus.py
          python3 test_path_h_exit_ticket.py
          python3 test_artifact_rung.py

      # Path findings goldens: a checklist keyword tweak must produce a
      # reviewable status-matrix diff, not an invisible rating shift.
      - name: Check path findings goldens
        run: python3 tools/snapshot_findings.py --check --paths
