<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P1×D Graph Lab — HAS-PART viz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14201c;
      --muted: #4a5c54;
      --paper: #eef2ef;
      --paper-2: #e2e9e4;
      --panel: #f7faf8;
      --line: #c5d0c9;
      --forest: #0f4c3a;
      --forest-soft: #1f6b52;
      --good: #1f7a4c;
      --bad: #b33a2b;
      --warn: #a66b12;
      --gold: #8a6d1d;
      --propose: #1d5f8a;
      --final: #6b3d7a;
      --shadow: 0 18px 40px rgba(20, 32, 28, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Figtree", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #d7e8df 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #dce4f0 0%, transparent 50%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
      min-height: 100vh;
    }

    .wrap { width: min(1280px, calc(100% - 2rem)); margin: 0 auto; padding: 2rem 0 4rem; }

    /* Hero: one composition — brand + story of the break */
    .hero {
      display: grid;
      gap: 1rem;
      padding: 1.25rem 0 2rem;
      animation: rise 0.7s ease both;
    }
    .brand {
      font-family: "Fraunces", serif;
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--forest);
      margin: 0;
    }
    .lede {
      max-width: 42rem;
      font-size: 1.1rem;
      color: var(--muted);
      margin: 0;
    }
    .break-banner {
      margin-top: 0.5rem;
      padding: 0.9rem 1.1rem;
      border-left: 4px solid var(--bad);
      background: rgba(179, 58, 43, 0.08);
      color: var(--ink);
      max-width: 52rem;
      animation: slideIn 0.8s 0.15s ease both;
    }
    .break-banner strong { color: var(--bad); }

    .section-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 1.5rem 0 0.75rem;
    }

    /* Gallery — interactive selectors (containers earn their surface) */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.85rem;
      animation: rise 0.7s 0.1s ease both;
    }
    .run {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 1rem 1.05rem;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      font: inherit;
      color: inherit;
    }
    .run:hover { transform: translateY(-2px); border-color: var(--forest-soft); }
    .run.active {
      border-color: var(--forest);
      box-shadow: 0 0 0 2px rgba(15, 76, 58, 0.25), var(--shadow);
    }
    .run.broken {
      border-color: rgba(179, 58, 43, 0.55);
      background: linear-gradient(180deg, #fff7f5 0%, var(--panel) 70%);
    }
    .run.broken.active {
      box-shadow: 0 0 0 2px rgba(179, 58, 43, 0.3), var(--shadow);
    }
    .run-top { display: flex; justify-content: space-between; gap: 0.5rem; align-items: start; }
    .run-title { font-weight: 700; font-size: 1rem; }
    .run-meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }
    .pill {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.25rem 0.5rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .pill.pass { background: rgba(31, 122, 76, 0.12); color: var(--good); }
    .pill.fail { background: rgba(179, 58, 43, 0.12); color: var(--bad); }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      margin-top: 0.85rem;
      font-size: 0.78rem;
    }
    .metric {
      background: rgba(20, 32, 28, 0.04);
      border-radius: 8px;
      padding: 0.4rem 0.45rem;
    }
    .metric b { display: block; font-size: 0.95rem; }

    .detail {
      margin-top: 1.75rem;
      animation: rise 0.5s ease both;
    }
    .detail-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .detail-head h2 {
      font-family: "Fraunces", serif;
      font-size: clamp(1.5rem, 3vw, 2rem);
      margin: 0;
      letter-spacing: -0.02em;
    }
    .story {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(179, 58, 43, 0.08);
      border-radius: 10px;
      color: var(--ink);
      margin: 0 0 1rem;
    }

    /* Span strip: best way to SEE the repair collapse */
    .span-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem 1.1rem 1.15rem;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
    }
    .span-panel h3 {
      margin: 0 0 0.35rem;
      font-size: 1rem;
    }
    .span-help { margin: 0 0 0.9rem; color: var(--muted); font-size: 0.9rem; }
    .lane {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 0.55rem;
      align-items: center;
      margin-bottom: 0.55rem;
    }
    .lane-label { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
    .track {
      position: relative;
      height: 28px;
      background: repeating-linear-gradient(
        90deg,
        rgba(20, 32, 28, 0.04) 0,
        rgba(20, 32, 28, 0.04) 1px,
        transparent 1px,
        transparent calc(100% / var(--ticks, 20))
      );
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .seg {
      position: absolute;
      top: 4px;
      bottom: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 0.4rem;
      font-size: 0.68rem;
      font-weight: 700;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      animation: growX 0.55s ease both;
      transform-origin: left center;
    }
    .seg.gold { background: var(--gold); }
    .seg.propose { background: var(--propose); }
    .seg.final { background: var(--final); }
    .seg.final.shrunk { outline: 2px solid var(--bad); outline-offset: 1px; }

    .graphs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.85rem;
    }
    @media (max-width: 960px) {
      .graphs { grid-template-columns: 1fr; }
    }
    .gpanel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.85rem;
      box-shadow: var(--shadow);
      min-height: 360px;
    }
    .gpanel h3 {
      margin: 0 0 0.25rem;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .gpanel .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.5rem; }
    .gpanel svg { width: 100%; height: 300px; display: block; }
    .node-course { fill: var(--forest); }
    .node-unit { fill: var(--forest-soft); }
    .node-lesson { fill: var(--propose); }
    .node-material { fill: #5a6e66; }
    .node-assessment { fill: var(--warn); }
    .node-activity { fill: #8a5a2b; }
    .node-other { fill: #6a7380; }
    .edge { stroke: #8aa094; stroke-width: 1.5; fill: none; opacity: 0.85; }
    .edge.describes { stroke: var(--warn); stroke-dasharray: 4 3; }
    .edge.spanIn { stroke: var(--propose); stroke-dasharray: 2 2; }
    .nlabel { fill: var(--ink); font-size: 11px; font-family: "Figtree", sans-serif; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem 1rem;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .swatch {
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 2px;
      margin-right: 0.3rem;
      vertical-align: -1px;
    }

    .pairs {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    @media (max-width: 720px) { .pairs { grid-template-columns: 1fr; } }
    .pairbox {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
    }
    .pairbox h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.35rem 0.25rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .iou-bad { color: var(--bad); font-weight: 700; }
    .iou-good { color: var(--good); font-weight: 700; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes growX {
      from { transform: scaleX(0.15); opacity: 0.4; }
      to { transform: scaleX(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1 class="brand">P1×D Graph Lab</h1>
      <p class="lede">
        Local view of HAS-PART graphs from the loom graphing experiment:
        code-first propose, optional model repair, scored against hand-built gold.
      </p>
      <div class="break-banner" id="breakBanner">Loading runs…</div>
    </header>

    <div class="section-label">All runs</div>
    <div class="gallery" id="gallery"></div>

    <section class="detail" id="detail" hidden></section>
  </div>

  <script>
    /**
     * Layout HAS-PART as a layered tree (Course → Unit → Lessons/Materials → kids).
     * Best practice: prefer structural layout over force-directed for hierarchy —
     * readers can compare gold / propose / final without nodes drifting between panes.
     */
    const TYPE_CLASS = {
      Course: "node-course",
      LessonGrouping: "node-unit",
      Lesson: "node-lesson",
      Material: "node-material",
      Assessment: "node-assessment",
      Activity: "node-activity",
    };

    const LAYER = {
      Course: 0,
      LessonGrouping: 1,
      Material: 2,
      Lesson: 2,
      Assessment: 3,
      Activity: 3,
    };

    function shortName(n) {
      const raw = n.name || n.id || "?";
      const id = n.id || "";
      if (n.type === "Material") {
        const m = id.match(/material:([a-f0-9]{6,})/i);
        return m ? `mat:${m[1].slice(0, 6)}` : raw.replace(/^doc_/, "").slice(0, 18);
      }
      if (n.type === "Lesson") return (raw.match(/Day\s*\d+/i) || [id.split(":").pop()])[0];
      if (n.type === "Assessment") return "Exit";
      if (n.type === "Activity") return "Activity";
      if (n.type === "LessonGrouping") return "Unit";
      if (n.type === "Course") return "Course";
      return String(raw).slice(0, 16);
    }

    function layoutGraph(graph) {
      const nodes = (graph.nodes || []).map((n) => ({ ...n }));
      const edges = graph.edges || [];
      const byLayer = {};
      for (const n of nodes) {
        const L = LAYER[n.type] ?? 2;
        (byLayer[L] ||= []).push(n);
      }
      const W = 360, H = 300, padX = 28, padY = 28;
      const layers = Object.keys(byLayer).map(Number).sort((a, b) => a - b);
      for (const L of layers) {
        const row = byLayer[L];
        const y = padY + (layers.indexOf(L) / Math.max(layers.length - 1, 1)) * (H - padY * 2);
        row.forEach((n, i) => {
          n.x = padX + (i / Math.max(row.length - 1, 1)) * (W - padX * 2);
          n.y = y;
          if (row.length === 1) n.x = W / 2;
        });
      }
      const pos = Object.fromEntries(nodes.map((n) => [n.id, n]));
      return { nodes, edges, pos, W, H };
    }

    function renderGraphSVG(graph, el) {
      const { nodes, edges, pos, W, H } = layoutGraph(graph);
      const parts = [];
      parts.push(`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`);
      for (const e of edges) {
        const a = pos[e.from], b = pos[e.to];
        if (!a || !b) continue;
        const cls = e.rel === "describes" ? "describes" : e.rel === "spanIn" ? "spanIn" : "";
        // Soft elbow so hierarchy reads top→bottom without crossing chaos.
        const midY = (a.y + b.y) / 2;
        parts.push(
          `<path class="edge ${cls}" d="M${a.x},${a.y + 10} C${a.x},${midY} ${b.x},${midY} ${b.x},${b.y - 12}" />`
        );
      }
      for (const n of nodes) {
        const cls = TYPE_CLASS[n.type] || "node-other";
        const r = n.type === "Course" || n.type === "LessonGrouping" ? 11 : 9;
        parts.push(`<circle class="${cls}" cx="${n.x}" cy="${n.y}" r="${r}" />`);
        parts.push(
          `<text class="nlabel" x="${n.x}" y="${n.y + 22}" text-anchor="middle">${escapeHtml(shortName(n))}</text>`
        );
      }
      parts.push("</svg>");
      el.innerHTML = parts.join("");
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function fmt(n) {
      if (n == null || Number.isNaN(n)) return "—";
      return typeof n === "number" ? (Number.isInteger(n) ? String(n) : n.toFixed(3)) : String(n);
    }

    function passPill(ok) {
      if (ok === true) return `<span class="pill pass">pass</span>`;
      if (ok === false) return `<span class="pill fail">fail</span>`;
      return `<span class="pill">n/a</span>`;
    }

    function maxPara(lessons) {
      let m = 1;
      for (const l of lessons || []) {
        const p = l.paragraphs || [];
        if (p[1] != null) m = Math.max(m, p[1]);
        if (p[0] != null) m = Math.max(m, p[0]);
      }
      return Math.max(m, 1);
    }

    function renderSpanLanes(run) {
      const gold = run.gold_lessons || [];
      const propose = run.propose.lessons || [];
      const final = run.final.lessons || [];
      const maxP = Math.max(maxPara(gold), maxPara(propose), maxPara(final), 10);

      function lane(label, lessons, cls) {
        const segs = (lessons || [])
          .map((l, i) => {
            const [a, b] = l.paragraphs || [];
            if (a == null || b == null) return "";
            const left = ((a - 1) / maxP) * 100;
            const width = Math.max(((b - a + 1) / maxP) * 100, 1.5);
            const goldMatch = (gold[i] || gold.find((g) => g.id === l.id) || {}).element_ids || [];
            const shrunk =
              cls === "final" && goldMatch.length && l.element_ids.length < goldMatch.length * 0.5
                ? " shrunk"
                : "";
            const title = `${l.id}: paras ${a}–${b}, ${l.element_ids.length} els`;
            return `<div class="seg ${cls}${shrunk}" style="left:${left}%;width:${width}%" title="${escapeHtml(title)}">${escapeHtml(shortLesson(l))}</div>`;
          })
          .join("");
        return `
          <div class="lane">
            <div class="lane-label">${label}</div>
            <div class="track" style="--ticks:${maxP}">${segs}</div>
          </div>`;
      }

      return `
        <div class="span-panel">
          <h3>Lesson span strip (paragraph range on source doc)</h3>
          <p class="span-help">
            Wide bars ≈ healthy day coverage. Tiny <em>final</em> bars with a red outline mean the repair
            collapsed lesson spans — that is how IoU and assessment_attach fell apart.
          </p>
          ${lane("Gold", gold, "gold")}
          ${lane("Propose", propose, "propose")}
          ${lane("Final", final, "final")}
        </div>`;
    }

    function shortLesson(l) {
      const m = String(l.name || l.id || "").match(/d\d+|Day\s*\d+/i);
      return m ? m[0].replace(/\s+/g, "") : (l.id || "?").split(":").pop();
    }

    function pairTable(score, title) {
      const rows = (score.lesson_pairs || [])
        .map((p) => {
          const bad = (p.iou ?? 0) < 0.5;
          return `<tr>
            <td>${escapeHtml(p.gold)}</td>
            <td>${escapeHtml(p.pred)}</td>
            <td class="${bad ? "iou-bad" : "iou-good"}">${fmt(p.iou)}</td>
          </tr>`;
        })
        .join("");
      return `
        <div class="pairbox">
          <h3>${title} ${passPill(score.pass)}</h3>
          <table>
            <thead><tr><th>Gold</th><th>Pred</th><th>IoU</th></tr></thead>
            <tbody>${rows || "<tr><td colspan=3>No pairs</td></tr>"}</tbody>
          </table>
          <div style="margin-top:0.55rem;font-size:0.82rem;color:var(--muted)">
            cov=${fmt(score.material_coverage)} ·
            mean IoU=${fmt(score.lesson_mean_iou)} ·
            assess=${fmt(score.assessment_attach)} ·
            edge F1=${fmt(score.edge_f1)} ·
            lessons ${fmt(score.n_pred_lessons)}/${fmt(score.n_gold_lessons)}
          </div>
        </div>`;
    }

    function renderDetail(data, run) {
      const el = document.getElementById("detail");
      el.hidden = false;
      const gold = data.gold[run.project] || { nodes: [], edges: [] };
      el.innerHTML = `
        <div class="detail-head">
          <h2>${escapeHtml(run.project)} · ${escapeHtml(run.stage)}</h2>
          <div style="color:var(--muted);font-size:0.85rem">${escapeHtml(run.id)}</div>
        </div>
        ${run.break_story ? `<p class="story"><strong>What broke:</strong> ${escapeHtml(run.break_story)}</p>` : ""}
        ${renderSpanLanes(run)}
        <div class="graphs">
          <div class="gpanel">
            <h3>Gold <span class="pill">truth</span></h3>
            <div class="sub">Hand-built HAS-PART</div>
            <div data-graph="gold"></div>
          </div>
          <div class="gpanel">
            <h3>Propose ${passPill(run.propose.score.pass)}</h3>
            <div class="sub">Code-first Day headers</div>
            <div data-graph="propose"></div>
          </div>
          <div class="gpanel">
            <h3>Final ${passPill(run.final.score.pass)}</h3>
            <div class="sub">${run.stage === "repaired" ? "After model repair" : "Same as propose (no repair)"}</div>
            <div data-graph="final"></div>
          </div>
        </div>
        <div class="legend">
          <span><i class="swatch" style="background:var(--forest)"></i>Course / unit</span>
          <span><i class="swatch" style="background:var(--propose)"></i>Lesson</span>
          <span><i class="swatch" style="background:#5a6e66"></i>Material</span>
          <span><i class="swatch" style="background:var(--warn)"></i>Assessment</span>
          <span>solid = hasPart · dashed blue = spanIn · dashed gold = describes</span>
        </div>
        <div class="pairs">
          ${pairTable(run.propose.score, "Propose score")}
          ${pairTable(run.final.score, "Final score")}
        </div>
      `;
      renderGraphSVG(gold, el.querySelector('[data-graph="gold"]'));
      renderGraphSVG(run.propose.graph, el.querySelector('[data-graph="propose"]'));
      renderGraphSVG(run.final.graph, el.querySelector('[data-graph="final"]'));
      el.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function main() {
      const res = await fetch("data.json");
      if (!res.ok) {
        document.getElementById("breakBanner").innerHTML =
          "Missing <code>data.json</code> — run <code>python3 build_data.py</code> in this folder.";
        return;
      }
      const data = await res.json();
      const broken = data.runs.find((r) => r.highlight);
      document.getElementById("breakBanner").innerHTML = broken
        ? `<strong>Break spotlight:</strong> ${escapeHtml(broken.project)} <em>${escapeHtml(broken.stage)}</em> — propose passed, final failed. ${escapeHtml(broken.break_story || "")}`
        : "All repaired finals passed provisional gates in this batch.";

      const gallery = document.getElementById("gallery");
      // Prefer opening on the broken run so the failure is immediately visible.
      let selected = broken || data.runs[data.runs.length - 1];

      function paintGallery() {
        gallery.innerHTML = data.runs
          .map((r) => {
            const finalPass = r.final.score.pass;
            return `
              <button class="run ${r.highlight ? "broken" : ""} ${r.id === selected.id ? "active" : ""}" data-id="${escapeHtml(r.id)}">
                <div class="run-top">
                  <div>
                    <div class="run-title">${escapeHtml(r.project)}</div>
                    <div class="run-meta">${escapeHtml(r.stage)} · ${escapeHtml(r.id.split("_").pop())}</div>
                  </div>
                  ${passPill(finalPass)}
                </div>
                <div class="metrics">
                  <div class="metric"><span>propose IoU</span><b>${fmt(r.propose.score.lesson_mean_iou)}</b></div>
                  <div class="metric"><span>final IoU</span><b>${fmt(r.final.score.lesson_mean_iou)}</b></div>
                  <div class="metric"><span>final assess</span><b>${fmt(r.final.score.assessment_attach)}</b></div>
                </div>
              </button>`;
          })
          .join("");
        gallery.querySelectorAll(".run").forEach((btn) => {
          btn.addEventListener("click", () => {
            selected = data.runs.find((r) => r.id === btn.dataset.id);
            paintGallery();
            renderDetail(data, selected);
          });
        });
      }

      paintGallery();
      renderDetail(data, selected);
    }

    main().catch((err) => {
      document.getElementById("breakBanner").textContent = String(err);
    });
  </script>
</body>
</html>
