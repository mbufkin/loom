project:
  id: dallas-career-2026
  name: Dallas ISD Career Clusters (sample)
sources_dir: sources
# Declared curriculum packet type (see workflows/packet_types.yaml). Sets the
# COMPLETENESS checklist each unit is measured against — it does NOT affect the
# quality band. Dallas is an activity/slide-based teacher resource, not a fully
# documented published course, so it is declared a Teacher Edition. Change this
# via the run-review start-point selector (or here) if a fuller packet is loaded.
packet_type: full_curriculum
# Human-confirmed pairs of units that legitimately, expectedly overlap — see
# docs/BETS.md Bet 12 and layer1/REVIEW-QUEUE.md. Confirmed 2026-07-08 by
# hand-checking the actual excerpts: both are on-topic engineering-design
# content sitting inside an adjacent CTE cluster's own materials, not filing
# errors (Texas CTE's own Architecture & Construction TEKS explicitly include
# engineering design methodologies; Transportation, Distribution & Logistics
# legitimately covers principles of flight / engineering design as core
# content). Never shown to Phase 1's model — Phase 2 (pure code) only.
known_overlaps:
  - [architecture-construction, engineering]
  - [transportation-distribution, engineering]
