# Standards & pacing plate → Loom checklist (Path F).
# Grain: YAG / pacing / scope-sequence / standards overview — not syllabus (G), not lesson (A).
# PRESENT = evidence in Layer 0 excerpts or source fallback; never invent.

version: "v1-standards-pacing"
role: standards_pacing
framework: pacing_standards_presence
source_template: docs/PATH-F-STANDARDS-PACING.md
path: F
workflow_id: standards_pacing

