          - week of
          - semester
          - midterm
          - final exam
          - timeline
      - id: teks_timeline
        label: TEKS / content coverage timeline claim
        element_types: [standards_objectives, logistics_materials]
        keywords:
          - TEKS
          - cover
          - covered
          - throughout the year
          - sequence
          - pacing
          - all TEKS

  g6_policies:
    label: G6 Policies & communication
    step: G6
    fields:
